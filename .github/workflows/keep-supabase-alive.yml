# Keeps the Supabase project active so it is not paused for inactivity.
# Runs every Monday and Thursday, and can also be started by hand (Actions tab > Run workflow).
# The address and key below are the same public values that are in config.js; they are not secrets.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the keep_alive function through the API
        run: |
          code=$(curl --silent --show-error --retry 3 --retry-delay 10 \
            --request POST --output /dev/null --write-out '%{http_code}' \
            --header "apikey: sb_publishable_5hsUuLfz5xtPfiq9n7h_cg__rbUPt7F" \
            --header "Content-Type: application/json" --data '{}' \
            "https://jxgsoniwxldyxpcyjhfs.supabase.co/rest/v1/rpc/keep_alive")
          echo "Supabase answered HTTP $code"
          # Any 2xx means the database was reached. Anything else fails the run,
          # and GitHub then emails the repository owner.
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
