<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Red Kite Housekeeping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap">
<style>
  /* Red Kite variant: palette sampled from the Red Kite website (forest green #243e30, olive #7b794e, sand #c7c5b2, cream #e6dcca), compact proportional type scale
     (15px base; 28 / 20 / 17 / 15 / 13 / 12), small radii, hairline borders, solid navy header band. */
  :root {
    --bg: #f4f0e6; --bar: #c7c5b2; --surface: #fffdf8; --fg: #11221c; --muted: #5b655f; --line: #ddd5c3;
    --link: #5b5a33; --green: #243e30; --green-2: #243e30; --glow: transparent;
    --on-green: #f4efe3; --on-green-muted: rgba(244,239,227,.78);
    --urgent: #a8321f; --important: #8a5a0a; --ok: #2f6b3f;
    --olive: #6c6a42; --cream: #e6dcca;
    --btn-bg: #6c6a42; --btn-fg: #ffffff;
    --brand: #243e30; --nav: #243e30;
    --font-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-brand: "Marcellus", "Trajan Pro", "Times New Roman", serif;
    --r: 8px; --r-sm: 6px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101a15; --bar: #1a2a21; --surface: #16231c; --fg: #ece8dc; --muted: #a2aba5; --line: #2a3a31;
      --link: #cfcb8f; --green: #0c1510; --green-2: #0c1510; --urgent: #f19a8f; --important: #f0b56c; --ok: #7fd1a3;
      --btn-bg: #cfcb8f; --btn-fg: #10190f; --brand: #e6dcca; --nav: #d9d6c4; --olive: #cfcb8f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101a15; --bar: #1a2a21; --surface: #16231c; --fg: #ece8dc; --muted: #a2aba5; --line: #2a3a31;
    --link: #cfcb8f; --green: #0c1510; --green-2: #0c1510; --urgent: #f19a8f; --important: #f0b56c; --ok: #7fd1a3;
    --btn-bg: #cfcb8f; --btn-fg: #10190f; --brand: #e6dcca; --nav: #d9d6c4; --olive: #cfcb8f; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased;
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  [hidden] { display: none !important; }
  a { color: var(--link); }
  img { max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .wide { max-width: 1080px; margin: 0 auto; }
  .full-bleed { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Top bar */
  .bar-bg { background: var(--bar); border-bottom: 1px solid var(--line); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 28px; min-height: 56px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--fg); padding-block: 12px; }
  .brand b { font: 700 15px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; }
  .brand span { padding-left: 12px; border-left: 1px solid var(--line); font: 500 13px/1 var(--font-body); color: var(--muted); letter-spacing: 0; text-transform: none; }
  .nav { display: flex; gap: 0 22px; flex-wrap: wrap; align-items: stretch; }
  .nav a, .nav button { display: inline-flex; align-items: center; padding: 18px 0 16px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; }
  .nav a:hover, .nav button:hover { color: var(--fg); }
  .nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--link); }
  .dot { display: inline-block; min-width: 18px; height: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--urgent); color: #fff; font: 600 11px/18px var(--font-body); text-align: center; }

  /* Title band */
  .band-bg { background: var(--green); color: var(--on-green); }
  .band { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-block: 28px; }
  .band h1 { margin: 0; font: 600 28px/1.2 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
  .band p { margin: 6px 0 0; color: var(--on-green-muted); font-size: 15px; max-width: 60ch; }
  .add { padding: 9px 16px; border-radius: var(--r-sm); border: 1px solid rgba(255,255,255,.45); background: transparent; color: var(--on-green); font-size: 14px; font-weight: 500; cursor: pointer; }
  .add:hover { background: rgba(255,255,255,.12); }

  .note { margin: 20px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--r-sm); background: var(--surface); font-size: 14px; color: var(--muted); }
  .note.ok { color: var(--ok); border-left-color: var(--ok); }
  .note.bad { color: var(--urgent); border-left-color: var(--urgent); }

  main { padding-block: 32px 16px; }
  .sec { margin-bottom: 36px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .sec-h h2 { margin: 0; font: 600 12px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sec-h a { font-size: 13px; text-decoration: none; font-weight: 500; }
  .sec-h a:hover { text-decoration: underline; }

  /* Rows become a bordered list panel */
  .item { padding: 16px 20px; background: var(--surface); border: 1px solid var(--line); border-bottom-width: 0; min-width: 0; }
  .item:first-child { border-top-left-radius: var(--r); border-top-right-radius: var(--r); }
  .item:last-child { border-bottom-width: 1px; border-bottom-left-radius: var(--r); border-bottom-right-radius: var(--r); }
  .item h3 { margin: 4px 0 0; font: 600 17px/1.35 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
  .item h3 a { color: var(--fg); text-decoration: none; }
  .item h3 a:hover { color: var(--link); }
  .item .sum { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .flag { font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
  .f-urgent { color: var(--urgent); }
  .f-important { color: var(--important); }
  .body { margin-top: 12px; }
  .txt { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 70ch; font-size: 14px; }

  .prose { max-width: 70ch; overflow-wrap: anywhere; }
  .prose p { margin: 0 0 .85em; }
  .prose ul { margin: 0 0 .85em; padding-left: 1.2em; }
  .prose li { margin-bottom: .3em; }
  .prose h3 { margin: 1.4em 0 .4em; font: 600 17px/1.3 var(--font-display); }
  .prose > :last-child { margin-bottom: 0; }
  .rich { max-width: none; overflow-x: auto; }
  .rich img { max-width: 100%; height: auto; }
  .rich table { max-width: 100%; border-collapse: collapse; }
  .rich td, .rich th { padding: 4px 8px; vertical-align: top; }
  .rich h1, .rich h2 { font: 600 20px/1.25 var(--font-display); margin: 1.2em 0 .4em; }

  .tabs { display: flex; flex-wrap: wrap; gap: 0 20px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
  .tab { padding: 8px 0; margin-bottom: -1px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
  .tab:hover { color: var(--fg); }
  .tab[aria-current="true"], .tab[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--link); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(20px, 3.5vw, 28px); }
  .card .kick { font: 600 12px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card h3 { margin: 8px 0 8px; font: 600 20px/1.3 var(--font-display); text-wrap: balance; }
  .card .sum { margin: 0 0 18px; color: var(--muted); max-width: 60ch; }
  .go { display: inline-block; padding: 9px 16px; border-radius: var(--r-sm); background: var(--btn-bg); color: var(--btn-fg); text-decoration: none; font-size: 14px; font-weight: 500; }
  .go:hover { opacity: .9; }
  .reader h2 { margin: 8px 0 10px; font: 600 26px/1.25 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
  .reader .lead { font-size: 16px; color: var(--muted); margin: 0 0 18px; max-width: 64ch; }
  .reader hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 18px; }
  .months { margin-bottom: 16px; }
  .empty { margin: 0; padding: 20px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); font-size: 14px; background: var(--surface); }

  .edit { background: none; border: 0; padding: 0; margin-top: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }
  .edit:hover { color: var(--fg); }

  /* Forms */
  .gf { display: grid; gap: 12px; }
  .gf h2 { margin: 0; font: 600 20px/1.3 var(--font-display); }
  .gf p { margin: 0; color: var(--muted); font-size: 14px; }
  .gf label { font-size: 13px; font-weight: 500; }
  .gf input { width: 100%; min-width: 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); }
  .gf .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 4px; }
  .sg { display: grid; gap: 12px; }
  .sg label { font: 600 17px/1.35 var(--font-display); text-wrap: balance; }
  .sg textarea, .sg input { width: 100%; min-width: 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); resize: vertical; line-height: 1.5; }
  .sg .btn { justify-self: start; }
  .sg .hint { margin: 0; font-size: 13px; color: var(--muted); }
  .sg-msg { margin: 0; font-size: 13px; color: var(--muted); }
  .sg-msg.ok { color: var(--ok); font-weight: 500; }
  .sg-msg.bad { color: var(--urgent); }
  .gap-top { margin-top: 36px; }

  .btn { padding: 9px 18px; border-radius: var(--r-sm); border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn:hover { opacity: .92; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.quiet { background: transparent; color: var(--fg); border-color: var(--line); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .link-danger { background: none; border: 0; padding: 0; color: var(--urgent); cursor: pointer; text-decoration: underline; font-size: 13px; }
  .link { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; text-decoration: underline; font-size: 13px; }

  #formHost[hidden] { display: none; }
  .overlay { position: fixed; inset: 0; z-index: 50; overflow-y: auto; background: rgba(12,21,16,.55);
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .form { width: min(640px, 100%); margin: 24px auto; padding: clamp(20px, 3.5vw, 28px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .form h2 { margin: 0 0 16px; font: 600 20px/1.3 var(--font-display); }
  .fields { display: grid; gap: 14px; }
  .field label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500; }
  .field input, .field select, .field textarea { width: 100%; min-width: 0; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); }
  .field textarea { resize: vertical; line-height: 1.5; }
  .field textarea.code { font: 400 12.5px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .field .hint { margin: 5px 0 0; font-size: 12px; color: var(--muted); }
  details.more { border-top: 1px solid var(--line); padding-top: 12px; }
  details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  details.more[open] summary { margin-bottom: 10px; }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--btn-bg); }
  .ferr { margin: 12px 0 0; color: var(--urgent); font-size: 13px; }
  .fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 20px; }
  .fbar .sp { flex: 1; }

  /* Sign-in */
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-block: 40px; }
  .gate-in { width: min(400px, 100%); display: grid; gap: 20px; justify-items: stretch; }
  .gate-brand { text-align: center; }
  .gate-brand b { display: block; font: 700 18px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; padding-left: .12em; }
  .gate-brand span { display: block; margin-top: 8px; font: 500 13px/1 var(--font-body); color: var(--muted); }
  .gate-foot { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }

  /* People */
  .person { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 20px; background: var(--surface); border: 1px solid var(--line); border-bottom-width: 0; }
  .person:first-of-type, .person:first-child { border-top-left-radius: var(--r); border-top-right-radius: var(--r); }
  .person:last-child { border-bottom-width: 1px; border-bottom-left-radius: var(--r); border-bottom-right-radius: var(--r); }
  .person .who { min-width: 0; overflow-wrap: anywhere; font-size: 14px; font-weight: 500; }
  .person .who small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .person .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .addrow { display: flex; flex-wrap: wrap; gap: 10px; }
  .addrow input { flex: 1 1 220px; min-width: 0; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); }

  footer { padding-block: 8px 32px; color: var(--muted); font-size: 12px; }

  /* Meet the team */
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .pcard { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
  .avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: var(--on-green); font: 600 15px/1 var(--font-body); letter-spacing: .04em; }
  .pinfo { min-width: 0; }
  .pname { font-weight: 600; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
  .ptitle { font-size: 13px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
  .pcard .edit { margin-top: 4px; }

  /* Red Kite site look: sand bar, forest-green band, flared capitals for brand and page titles */
  .bar-bg { border-bottom: 0; }
  .brand b { font: 400 24px/1 var(--font-brand); letter-spacing: .1em; color: var(--brand); }
  .brand span { border-left-color: color-mix(in srgb, var(--brand) 35%, transparent); color: var(--brand); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
  .nav a, .nav button { color: var(--nav); text-transform: uppercase; letter-spacing: .05em; font-size: 12.5px; font-weight: 500; }
  .nav a:hover, .nav button:hover { color: var(--brand); }
  .nav a[aria-current="page"] { color: var(--brand); font-weight: 600; border-bottom-color: var(--brand); }
  .dot { background: var(--brand); color: var(--bar); }
  .band h1 { font: 400 32px/1.15 var(--font-brand); letter-spacing: .04em; text-transform: uppercase; }
  .reader h2, .card h3 { font-family: var(--font-brand); font-weight: 400; letter-spacing: .01em; }
  .reader h2 { font-size: 30px; }
  .card h3 { font-size: 23px; }
  .gate-brand b { font: 400 26px/1 var(--font-brand); letter-spacing: .12em; color: var(--brand); }
  .gate-brand span { text-transform: uppercase; letter-spacing: .16em; font-size: 12px; }
  .btn:hover, .go:hover { opacity: 1; filter: brightness(.94); }
  .btn.quiet { color: var(--fg); background: var(--cream); border-color: var(--cream); }
  :root[data-theme="dark"] .btn.quiet { background: transparent; border-color: var(--line); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.quiet { background: transparent; border-color: var(--line); } }
  .avatar { background: var(--olive); color: #fff; }
  :root[data-theme="dark"] .avatar { color: #10190f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avatar { color: #10190f; } }

  /* Type scale, refined: smaller and lighter (base 14px; 26 / 24 / 20 / 15.5 / 14 / 13 / 12 / 11) */
  body { font-size: 14px; line-height: 1.6; }
  .brand b { font-size: 20px; }
  .brand span { font-size: 10.5px; letter-spacing: .16em; }
  .nav a, .nav button { font-size: 11.5px; letter-spacing: .07em; }
  .nav { gap: 0 20px; }
  .dot { min-width: 16px; height: 16px; font-size: 10px; line-height: 16px; padding: 0 4px; }
  .band { padding-block: 22px; }
  .band h1 { font-size: 24px; letter-spacing: .05em; }
  .band p { font-size: 13.5px; margin-top: 4px; }
  .add { font-size: 12.5px; padding: 8px 14px; }
  .note { font-size: 13px; }
  main { padding-block: 28px 12px; }
  .sec { margin-bottom: 32px; }
  .sec-h h2 { font-size: 10.5px; letter-spacing: .12em; }
  .sec-h a { font-size: 12px; }
  .item { padding: 14px 18px; }
  .item h3 { font-size: 15.5px; font-weight: 600; }
  .item .sum { font-size: 13px; }
  .meta { font-size: 11.5px; }
  .flag { font-size: 10px; letter-spacing: .06em; }
  .txt { font-size: 13px; }
  .prose h3 { font-size: 15.5px; }
  .rich h1, .rich h2 { font-size: 18px; }
  .tab { font-size: 12.5px; }
  .card .kick { font-size: 10.5px; letter-spacing: .12em; }
  .card h3 { font-size: 19px; }
  .card .sum { font-size: 13.5px; }
  .go { font-size: 12.5px; padding: 8px 14px; }
  .reader h2 { font-size: 24px; line-height: 1.25; }
  .reader .lead { font-size: 14.5px; }
  .empty { font-size: 13px; }
  .gf h2 { font-size: 18px; }
  .gf p { font-size: 13px; }
  .gf label { font-size: 12px; }
  .sg label { font-size: 15px; }
  .sg-msg { font-size: 12.5px; }
  .sg .hint, .field .hint { font-size: 11.5px; }
  .btn { font-size: 12.5px; padding: 8px 16px; }
  .btn.small { font-size: 12px; padding: 5px 11px; }
  .link, .link-danger, .edit { font-size: 12px; }
  .form h2 { font-size: 18px; }
  .field label { font-size: 12px; }
  .field textarea.code { font-size: 12px; }
  .ferr { font-size: 12.5px; }
  .chk { font-size: 13px; }
  .person .who { font-size: 13.5px; }
  .person .who small { font-size: 11.5px; }
  .pname { font-size: 14px; }
  .ptitle { font-size: 12px; }
  .avatar { width: 40px; height: 40px; font-size: 13px; }
  .gate-brand b { font-size: 22px; }
  .gate-brand span { font-size: 10.5px; }
  .gate-foot, footer { font-size: 11px; }
  /* Phones zoom into inputs smaller than 16px, so keep fields at 16px there. */
  @media (max-width: 640px) { input, select, textarea { font-size: 16px; } .band h1 { font-size: 22px; } .reader h2 { font-size: 22px; } }

  /* Refined, smaller type scale: 14 body / 15 list titles / 19-24 headings / 11-12 labels */
  body { font-size: 14px; line-height: 1.6; }
  .bar { min-height: 52px; }
  .brand b { font-size: 20px; letter-spacing: .12em; }
  .brand span { font-size: 10.5px; letter-spacing: .16em; }
  .nav { gap: 0 20px; }
  .nav a, .nav button { font-size: 11.5px; letter-spacing: .07em; padding: 17px 0 15px; }
  .dot { min-width: 16px; height: 16px; font-size: 10px; line-height: 16px; padding: 0 4px; }
  .band { padding-block: 24px; }
  .band h1 { font-size: 25px; letter-spacing: .06em; }
  .band p { font-size: 13.5px; margin-top: 4px; }
  .add { font-size: 12.5px; padding: 8px 14px; letter-spacing: .02em; }
  .note { font-size: 13px; }
  main { padding-block: 28px 12px; }
  .sec { margin-bottom: 32px; }
  .sec-h h2 { font-size: 11px; letter-spacing: .12em; }
  .sec-h a { font-size: 12px; }
  .item { padding: 14px 18px; }
  .item h3 { font-size: 15px; font-weight: 500; line-height: 1.4; }
  .item .sum { font-size: 13px; margin-top: 3px; }
  .meta { font-size: 11.5px; }
  .flag { font-size: 10.5px; letter-spacing: .06em; }
  .txt { font-size: 13.5px; }
  .prose { font-size: 14px; }
  .prose h3 { font-size: 15.5px; font-weight: 500; }
  .rich h1, .rich h2 { font-size: 18px; font-weight: 500; }
  .tab { font-size: 13px; }
  .card { padding: clamp(18px, 3vw, 26px); }
  .card .kick { font-size: 11px; letter-spacing: .12em; }
  .card h3 { font-size: 19px; margin: 6px 0 6px; }
  .card .sum { font-size: 13.5px; margin-bottom: 16px; }
  .go, .btn { font-size: 12.5px; letter-spacing: .02em; }
  .go { padding: 8px 15px; }
  .btn { padding: 8px 16px; }
  .btn.small { font-size: 12px; padding: 5px 11px; }
  .reader h2 { font-size: 24px; line-height: 1.25; margin: 6px 0 8px; }
  .reader .lead { font-size: 14.5px; margin-bottom: 16px; }
  .empty { font-size: 13px; padding: 18px; }
  .edit, .link, .link-danger { font-size: 12px; }
  .gf h2 { font-size: 18px; font-weight: 500; }
  .gf p { font-size: 13px; }
  .gf label, .field label { font-size: 12.5px; }
  .gf input, .field input, .field select, .field textarea, .sg textarea, .sg input, .addrow input { font-size: 13.5px; padding: 9px 12px; }
  .field .hint, .sg .hint { font-size: 11.5px; }
  .sg label { font-size: 15px; font-weight: 500; }
  .sg-msg { font-size: 12.5px; }
  .form h2 { font-size: 18px; font-weight: 500; }
  .chk { font-size: 13px; }
  .ferr { font-size: 12.5px; }
  .gate-brand b { font-size: 22px; }
  .gate-brand span { font-size: 10.5px; }
  .gate-foot, footer { font-size: 11px; }
  .person { padding: 11px 18px; }
  .person .who { font-size: 13.5px; }
  .person .who small { font-size: 11.5px; }
  .people { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .pcard { padding: 12px 14px; gap: 12px; }
  .avatar { width: 40px; height: 40px; font-size: 13px; }
  .pname { font-size: 14px; font-weight: 500; }
  .ptitle { font-size: 12px; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-in">
    <div class="gate-brand"><b>Redkite</b><span>Housekeeping</span></div>
    <div class="card" id="gateBody"><p class="sum" style="margin:0">Loading…</p></div>
    <p class="gate-foot">Internal use only. Red Kite Hosts housekeeping team.</p>
  </div>
</div>

<div id="app" hidden>
  <div class="bar-bg full-bleed">
    <div class="wide bar">
      <a class="brand" href="#home" aria-label="Red Kite Housekeeping, home"><b>Redkite</b><span>Housekeeping</span></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
    </div>
  </div>
  <div class="band-bg full-bleed">
    <div class="wide band">
      <div><h1 id="bandTitle"></h1><p id="bandSub"></p></div>
      <button type="button" class="add" id="addBtn" hidden></button>
    </div>
  </div>
  <div class="wrap">
    <p class="note" id="note" role="status" hidden></p>
    <main id="main"></main>
    <footer>Internal use only. Red Kite Hosts housekeeping team.</footer>
  </div>
</div>
<div id="formHost" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(function () {
  'use strict';

  const CFG = window.HK_CONFIG || {};
  const configured = !!(CFG.SUPABASE_URL && CFG.SUPABASE_KEY && String(CFG.SUPABASE_URL).indexOf('YOUR') < 0);
  const sb = (configured && window.supabase)
    ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } })
    : null;

  const PRIO = { urgent: 'Urgent', important: 'Important', info: 'Normal' };
  const BAND = {
    home: ['Housekeeping', 'Updates, newsletters and news for the Red Kite team.'],
    updates: ['Updates', 'Notices for the whole team.'],
    newsletters: ['Newsletters', 'One issue each month.'],
    news: ['News', 'Housekeeping news from the UK and around the world.'],
    team: ['Meet the team', 'The people behind Red Kite housekeeping.'],
    suggestions: ['Suggestions', 'Tell us what to write about and what we can do better.'],
    people: ['People', 'Who can open the hub.']
  };
  const ADD = { updates: 'Add update', newsletters: 'Add newsletter', news: 'Add news', team: 'Add person' };
  const TEAMS = ['Founder', 'Operations & Strategy Team', 'Sales and Customer Success Team', 'Onboarding & Account Manager Team', 'Onboarding Team', 'Account Manager Team', 'Guest Experience Team', 'Finance Team', 'Housekeeping Team', 'Senior Housekeepers', 'Housekeepers', 'Maintenance Team'];

  const data = { updates: [], newsletters: [], news: [], team: [], suggestions: [], allowed: [], requests: [] };
  const st = { route: getRoute(), email: null, role: null, ready: false, region: 'all', editing: null };
  let current = { update: function () {} };
  let noteTimer = null;

  const $ = (s, el) => (el || document).querySelector(s);

  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach((k) => {
        const v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      });
    }
    (function add(list) {
      list.forEach((k) => {
        if (k == null || k === false) return;
        if (Array.isArray(k)) return add(k);
        e.append(k.nodeType ? k : document.createTextNode(String(k)));
      });
    })(kids);
    return e;
  }

  const isAdmin = () => st.role === 'admin';
  function safeUrl(u) { try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; } catch (e) { return null; } }
  function host_(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }

  const dfmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const mfmt = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' });
  function fd(iso) { if (!iso) return ''; const d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); return isNaN(d) ? '' : dfmt.format(d); }
  function fm(m) { if (!m) return ''; const d = new Date(m + '-01T12:00:00'); return isNaN(d) ? m : mfmt.format(d); }
  function byDate(a, b) {
    const x = a.date || '', y = b.date || '';
    if (x === y) return (b.created_at || '') < (a.created_at || '') ? -1 : 1;
    if (!x) return 1;
    if (!y) return -1;
    return x < y ? 1 : -1;
  }
  function byMonth(a, b) { return a.month === b.month ? ((b.created_at || '') < (a.created_at || '') ? -1 : 1) : (a.month < b.month ? 1 : -1); }

  function getRoute() {
    const s = (location.hash || '').slice(1);
    if (s.indexOf('issue-') === 0) return { view: 'newsletters', issue: s.slice(6) };
    if (s.indexOf('update-') === 0) return { view: 'updates', update: s.slice(7) };
    if (['updates', 'newsletters', 'news', 'team', 'suggestions', 'people'].indexOf(s) > -1) return { view: s };
    return { view: 'home' };
  }

  function note(msg, kind, ms) {
    const n = $('#note');
    clearTimeout(noteTimer);
    if (!msg) { n.hidden = true; return; }
    n.textContent = msg; n.className = 'note' + (kind ? ' ' + kind : ''); n.hidden = false;
    if (ms) noteTimer = setTimeout(() => { n.hidden = true; }, ms);
  }

  /* "## Heading" lines, "- " bullets, blank line between paragraphs. */
  function renderBody(text) {
    const wrap = h('div', { class: 'prose' });
    String(text || '').replace(/\r/g, '').split(/\n{2,}/).forEach((block) => {
      const lines = block.split('\n').filter((l) => l.trim());
      if (!lines.length) return;
      if (/^##\s+/.test(lines[0])) {
        wrap.append(h('h3', { text: lines[0].replace(/^##\s+/, '') }));
        lines.shift();
        if (!lines.length) return;
      }
      if (lines.every((l) => /^[-•]\s+/.test(l))) wrap.append(h('ul', null, lines.map((l) => h('li', { text: l.replace(/^[-•]\s+/, '') }))));
      else wrap.append(h('p', { text: lines.join(' ') }));
    });
    return wrap;
  }

  /* Pasted HTML is always sanitised: no scripts, forms, frames or event handlers. */
  const PURIFY = { FORBID_TAGS: ['style', 'form', 'input', 'button', 'textarea', 'select', 'iframe', 'object', 'embed', 'link', 'meta', 'base'], ADD_ATTR: ['target'] };
  let hookSet = false;
  function renderRich(item) {
    if (item.html) {
      const P = window.DOMPurify;
      if (!P) return h('div', { class: 'prose' }, h('p', { class: 'empty', text: 'The HTML viewer could not load. Reload the page to see this content.' }));
      if (!hookSet && P.addHook) {
        P.addHook('afterSanitizeAttributes', (node) => {
          if (node.tagName === 'A' && node.getAttribute('href')) { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
        });
        hookSet = true;
      }
      const box = h('div', { class: 'prose rich' });
      box.innerHTML = P.sanitize(String(item.html), PURIFY);
      return box;
    }
    return item.body ? renderBody(item.body) : null;
  }

  function section(title, body, moreText, moreHref) {
    return h('section', { class: 'sec' },
      h('div', { class: 'sec-h' }, h('h2', { text: title }), moreText && h('a', { href: moreHref, text: moreText })), body);
  }
  const empty = (msg) => h('p', { class: 'empty', text: msg });
  function editLink(kind, item) {
    if (!isAdmin()) return null;
    return h('button', { type: 'button', class: 'edit', text: 'Edit', onclick: () => openForm(kind, item) });
  }

  /* Short teaser shown under the title: first lines of the text, plain, clipped. */
  function teaser(u) {
    let t = '';
    if (u.body) t = (String(u.body).replace(/\r/g, '').split(/\n{2,}/).map((x) => x.replace(/^##\s+.*$/gm, '').replace(/^[-•]\s+/gm, '').trim()).filter(Boolean)[0]) || '';
    else if (u.html) { const d = document.createElement('div'); d.innerHTML = window.DOMPurify ? window.DOMPurify.sanitize(String(u.html), { FORBID_TAGS: ['style', 'script'] }) : ''; t = d.textContent || ''; }
    t = t.replace(/\s+/g, ' ').trim();
    if (t.length > 150) t = t.slice(0, 150).replace(/\s+\S*$/, '') + '…';
    return t;
  }

  /* A "cover": priority and date, title, one line underneath. Opens the full update. */
  function updateRow(u) {
    const p = u.priority, tz = teaser(u);
    return h('article', { class: 'item' },
      h('div', { class: 'meta' },
        (p === 'urgent' || p === 'important') && h('span', { class: 'flag f-' + p, text: PRIO[p] }),
        h('span', { text: fd(u.date) })),
      h('h3', null, h('a', { href: '#update-' + u.id, text: u.title || 'Untitled' })),
      tz && h('p', { class: 'sum', text: tz }));
  }

  function updateFull(u) {
    const p = u.priority;
    return h('article', { class: 'card reader' },
      h('div', { class: 'meta' },
        (p === 'urgent' || p === 'important') && h('span', { class: 'flag f-' + p, text: PRIO[p] }),
        h('span', { text: fd(u.date) })),
      h('h2', { text: u.title || 'Untitled' }),
      h('hr'),
      renderRich(u),
      editLink('updates', u));
  }

  function newsRow(n, compact) {
    const url = safeUrl(n.url);
    const title = url ? h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', text: n.title || 'Untitled' }) : (n.title || 'Untitled');
    const meta = [n.region === 'UK' ? 'UK' : 'World', n.source || (url ? host_(url) : ''), fd(n.date)].filter(Boolean);
    return h('article', { class: 'item' },
      h('div', { class: 'meta' }, meta.map((m) => h('span', { text: m }))),
      h('h3', null, title),
      !compact && n.summary && h('p', { class: 'sum', text: n.summary }),
      !compact && editLink('news', n));
  }

  /* ---------- Views ---------- */

  function mountHome(root) {
    const upHost = h('div'), nlHost = h('div'), newsHost = h('div');
    root.append(
      section('Latest updates', upHost, 'See all', '#updates'),
      section('Newsletter', nlHost, 'All issues', '#newsletters'),
      section('In the news', newsHost, 'More news', '#news'));
    return function () {
      const ups = data.updates.slice().sort(byDate).slice(0, 3);
      upHost.replaceChildren();
      if (!st.ready) upHost.append(empty('Loading…'));
      else if (!ups.length) upHost.append(empty('No updates yet.'));
      else ups.forEach((u) => upHost.append(updateRow(u)));

      const nls = data.newsletters.slice().sort(byMonth);
      nlHost.replaceChildren();
      if (!st.ready) nlHost.append(empty('Loading…'));
      else if (!nls.length) nlHost.append(empty('No newsletters yet.'));
      else {
        const n = nls[0];
        nlHost.append(h('div', { class: 'card' },
          h('div', { class: 'kick', text: fm(n.month) }),
          h('h3', { text: n.title || fm(n.month) }),
          n.intro && h('p', { class: 'sum', text: n.intro }),
          h('a', { class: 'go', href: '#issue-' + n.id, text: 'Read the issue' })));
      }

      const news = data.news.slice().sort(byDate).slice(0, 3);
      newsHost.replaceChildren();
      if (!st.ready) newsHost.append(empty('Loading…'));
      else if (!news.length) newsHost.append(empty('No news yet.'));
      else news.forEach((x) => newsHost.append(newsRow(x, true)));
    };
  }

  function mountUpdates(root) {
    const list = h('div');
    root.append(list);
    return function () {
      list.replaceChildren();
      if (!st.ready) { list.append(empty('Loading…')); return; }
      const opened = st.route.update && data.updates.filter((x) => x.id === st.route.update)[0];
      if (opened) {
        list.append(h('p', null, h('a', { href: '#updates', text: '← All updates' })), updateFull(opened));
        return;
      }
      const items = data.updates.slice().sort(byDate);
      if (!items.length) list.append(empty('No updates yet.'));
      else items.forEach((u) => list.append(updateRow(u)));
    };
  }

  /* The list shows one cover per issue (month, title, opening line). Clicking opens the issue. */
  function mountNewsletters(root) {
    const host = h('div');
    root.append(host);
    return function () {
      host.replaceChildren();
      if (!st.ready) { host.append(empty('Loading…')); return; }
      const items = data.newsletters.slice().sort(byMonth);
      if (!items.length) { host.append(empty('No newsletters yet.')); return; }
      const sel = st.route.issue && items.filter((n) => n.id === st.route.issue)[0];
      if (sel) {
        const url = safeUrl(sel.link);
        host.append(
          h('p', null, h('a', { href: '#newsletters', text: '← All newsletters' })),
          h('article', { class: 'card reader' },
            h('div', { class: 'meta' }, h('span', { text: fm(sel.month) })),
            h('h2', { text: sel.title || fm(sel.month) }),
            sel.intro && h('p', { class: 'lead', text: sel.intro }),
            h('hr'),
            renderRich(sel),
            url && h('p', null, h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', text: 'Open the original (' + host_(url) + ')' })),
            editLink('newsletters', sel)));
        return;
      }
      items.forEach((n) => {
        const line = n.intro || teaser(n);
        host.append(h('article', { class: 'item' },
          h('div', { class: 'meta' }, h('span', { text: fm(n.month) })),
          h('h3', null, h('a', { href: '#issue-' + n.id, text: n.title || fm(n.month) })),
          line && h('p', { class: 'sum', text: line })));
      });
    };
  }

  function mountNews(root) {
    const tabs = h('div', { class: 'tabs', role: 'group' });
    const list = h('div');
    root.append(tabs, list);
    function drawTabs() {
      tabs.replaceChildren(...[['all', 'All'], ['UK', 'UK'], ['World', 'World']].map((o) =>
        h('button', { type: 'button', class: 'tab', 'aria-pressed': String(st.region === o[0]), text: o[1], onclick: () => { st.region = o[0]; drawTabs(); current.update(); } })));
    }
    drawTabs();
    return function () {
      const items = data.news.slice().sort(byDate).filter((n) => st.region === 'all' || (st.region === 'UK' ? n.region === 'UK' : n.region !== 'UK'));
      list.replaceChildren();
      if (!st.ready) list.append(empty('Loading…'));
      else if (!items.length) list.append(empty('No news here yet.'));
      else items.forEach((n) => list.append(newsRow(n, false)));
    };
  }

  /* Meet the team: people grouped by team, each with initials, name and job title. */
  function initials(n) {
    const p = String(n || '').replace(/\(.*?\)/g, ' ').trim().split(/\s+/).filter(Boolean);
    return ((p[0] || '')[0] || '').toUpperCase() + ((p.length > 1 ? p[p.length - 1][0] : '') || '').toUpperCase();
  }
  function mountTeam(root) {
    const list = h('div');
    root.append(list);
    return function () {
      list.replaceChildren();
      if (!st.ready) { list.append(empty('Loading…')); return; }
      if (!data.team.length) { list.append(empty(isAdmin() ? 'Nobody here yet. Use “Add person” to start.' : 'The team will appear here soon.')); return; }
      TEAMS.forEach((g) => {
        const people = data.team.filter((p) => p.team === g).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        if (!people.length) return;
        list.append(section(g, h('div', { class: 'people' }, people.map((p) =>
          h('div', { class: 'pcard' },
            h('div', { class: 'avatar', 'aria-hidden': 'true', text: initials(p.name) }),
            h('div', { class: 'pinfo' }, h('div', { class: 'pname', text: p.name }), h('div', { class: 'ptitle', text: p.title }), editLink('team_members', p)))))));
      });
    };
  }

  function mountSuggestions(root) {
    const ta = h('textarea', { id: 'sg-text', rows: 4, placeholder: 'For example: a refresher on deep-clean checklists, or tips for busy turnaround days' });
    const tb = h('textarea', { id: 'sg-better', rows: 4, placeholder: 'For example: the way we hand over keys, supplies, scheduling, communication' });
    const nm = h('input', { id: 'sg-name', type: 'text', placeholder: 'Your name (optional)', 'aria-label': 'Your name (optional)', autocomplete: 'off' });
    const msg = h('p', { class: 'sg-msg', role: 'status', hidden: true });
    const send = h('button', { type: 'submit', class: 'btn', text: 'Send' });
    const form = h('form', { class: 'card sg' },
      h('label', { for: 'sg-text', text: 'What would you like to see in the next newsletter?' }), ta,
      h('label', { for: 'sg-better', text: 'What can we do better?' }), tb,
      nm,
      h('p', { class: 'hint', text: 'Answer one or both. Only the hub manager sees what you send, together with your email address.' }), msg, send);
    const inbox = h('div');
    const say = (text, cls) => { msg.textContent = text; msg.className = 'sg-msg ' + (cls || ''); msg.hidden = false; };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = nm.value.trim() || null;
      const rows = [];
      if (ta.value.trim()) rows.push({ author_email: st.email, name, text: ta.value.trim(), category: 'newsletter' });
      if (tb.value.trim()) rows.push({ author_email: st.email, name, text: tb.value.trim(), category: 'improvement' });
      if (!rows.length) { say('Write at least one answer first.', 'bad'); return; }
      send.disabled = true; msg.hidden = true;
      const { error } = await sb.from('suggestions').insert(rows);
      send.disabled = false;
      if (error) { say('Could not send. Check your connection and try again.', 'bad'); return; }
      ta.value = ''; tb.value = '';
      say('Thank you. Your answer has been sent.', 'ok');
      if (isAdmin()) loadAll();
    });
    root.append(form, inbox);
    return function () {
      inbox.replaceChildren();
      if (!isAdmin()) return;
      const all = data.suggestions.slice().sort((a, b) => ((b.created_at || '') < (a.created_at || '') ? -1 : 1));
      const list = h('div');
      if (!st.ready) list.append(empty('Loading…'));
      else if (!all.length) list.append(empty('Nothing received yet.'));
      else all.forEach((x) => {
        let armed = false;
        const del = h('button', { type: 'button', class: 'edit', text: 'Remove' });
        del.addEventListener('click', async () => {
          if (!armed) { armed = true; del.textContent = 'Click again to remove'; return; }
          del.disabled = true;
          const r = await sb.from('suggestions').delete().eq('id', x.id);
          if (r.error) { del.disabled = false; armed = false; del.textContent = 'Could not remove, try again'; return; }
          loadAll();
        });
        list.append(h('article', { class: 'item' },
          h('div', { class: 'meta' },
            h('span', { class: 'flag', text: x.category === 'improvement' ? 'What can we do better' : 'Newsletter topic' }),
            h('span', { text: x.name ? x.name + ' (' + x.author_email + ')' : x.author_email }), h('span', { text: fd(x.created_at) })),
          h('p', { class: 'txt', text: x.text }), del));
      });
      inbox.append(h('div', { class: 'gap-top' }, section('Received', list)));
    };
  }

  function mountPeople(root) {
    const reqHost = h('div'), allowHost = h('div');
    const input = h('input', { id: 'add-email', type: 'email', placeholder: 'name@example.com', 'aria-label': 'Email to add', autocomplete: 'off' });
    const err = h('p', { class: 'ferr', role: 'alert', hidden: true });
    const add = h('form', null, h('div', { class: 'addrow' }, input, h('button', { type: 'submit', class: 'btn', text: 'Add' })), err);
    add.addEventListener('submit', (e) => { e.preventDefault(); approve(input.value, err).then((ok) => { if (ok) input.value = ''; }); });
    root.append(section('Waiting for approval', reqHost), section('Can enter', allowHost), section('Add an email', add));
    return function () {
      reqHost.replaceChildren(); allowHost.replaceChildren();
      if (!st.ready) { reqHost.append(empty('Loading…')); return; }
      const reqs = data.requests.slice().sort((a, b) => (a.requested_at < b.requested_at ? -1 : 1));
      if (!reqs.length) reqHost.append(empty('Nobody is waiting.'));
      reqs.forEach((r) => {
        const msg = h('span', { class: 'sg-msg', role: 'status', hidden: true });
        reqHost.append(h('div', { class: 'person' },
          h('div', { class: 'who' }, r.email, h('small', { text: 'Asked on ' + fd(r.requested_at) })),
          h('div', { class: 'acts' }, msg,
            h('button', { type: 'button', class: 'btn small', text: 'Approve', onclick: (ev) => { ev.target.disabled = true; approve(r.email, msg).then((ok) => { if (!ok) ev.target.disabled = false; }); } }),
            h('button', { type: 'button', class: 'link-danger', text: 'Decline', onclick: () => decline(r.email) }))));
      });
      const people = data.allowed.slice().sort((a, b) => (a.role === b.role ? (a.email < b.email ? -1 : 1) : (a.role === 'admin' ? -1 : 1)));
      people.forEach((p) => {
        let armed = false;
        const mine = p.email === st.email;
        const rm = mine ? null : h('button', { type: 'button', class: 'link-danger', text: 'Remove' });
        if (rm) rm.addEventListener('click', async () => {
          if (!armed) { armed = true; rm.textContent = 'Click again to remove'; return; }
          rm.disabled = true;
          const r = await sb.from('allowed_emails').delete().eq('email', p.email);
          if (r.error) { rm.disabled = false; armed = false; rm.textContent = 'Could not remove'; return; }
          await loadAll(); note('Removed ' + p.email + '.', 'ok', 5000);
        });
        allowHost.append(h('div', { class: 'person' },
          h('div', { class: 'who' }, p.email, h('small', { text: p.role === 'admin' ? 'Administrator' + (mine ? ' (you)' : '') : 'Member' })),
          h('div', { class: 'acts' }, rm)));
      });
    };
  }

  async function approve(rawEmail, msgEl) {
    const email = String(rawEmail || '').trim().toLowerCase();
    const show = (t) => { if (msgEl) { msgEl.textContent = t; msgEl.hidden = false; } };
    if (!email || email.indexOf('@') < 1) { show('Enter a full email address.'); return false; }
    const r = await sb.rpc('approve_email', { p_email: email });
    if (r.error) { show('Could not approve. Try again.'); return false; }
    await loadAll();
    note(email + ' can now enter.', 'ok', 6000);
    return true;
  }
  async function decline(email) {
    const r = await sb.from('access_requests').delete().eq('email', email);
    if (r.error) { note('Could not decline. Try again.', 'bad', 6000); return; }
    await loadAll();
  }

  /* ---------- Editor ---------- */

  const HTML_HINT = 'Scripts, forms and frames are removed. Images must be embedded in the HTML; images hosted elsewhere will not load.';
  const FORMS = {
    updates: {
      label: 'update',
      fields: [
        { k: 'title', l: 'Title', t: 'text', req: 1 },
        { k: 'body', l: 'Message', t: 'textarea', rows: 5, hint: 'Blank line between paragraphs. Start lines with “- ” for a list.' },
        { k: 'priority', l: 'Priority', t: 'select', o: [['info', 'Normal'], ['important', 'Important'], ['urgent', 'Urgent']] },
        { k: 'html', l: 'Paste HTML instead', t: 'textarea', rows: 6, code: 1, more: 1, hint: HTML_HINT }
      ]
    },
    news: {
      label: 'news',
      fields: [
        { k: 'title', l: 'Headline', t: 'text', req: 1 },
        { k: 'summary', l: 'Short summary', t: 'textarea', rows: 3, hint: 'In your own words.' },
        { k: 'url', l: 'Link to the article', t: 'url' },
        { k: 'region', l: 'Region', t: 'select', o: [['UK', 'UK'], ['World', 'World']] }
      ]
    },
    team_members: {
      label: 'person',
      fields: [
        { k: 'name', l: 'Name', t: 'text', req: 1 },
        { k: 'title', l: 'Job title', t: 'text', req: 1 },
        { k: 'team', l: 'Group', t: 'select', o: TEAMS.map((x) => [x, x]) }
      ]
    },
    newsletters: {
      label: 'newsletter',
      fields: [
        { k: 'title', l: 'Title', t: 'text', req: 1 },
        { k: 'month', l: 'Month', t: 'month', req: 1 },
        { k: 'intro', l: 'Opening line', t: 'textarea', rows: 2 },
        { k: 'body', l: 'Content', t: 'textarea', rows: 10, hint: 'Start a section with “## Heading”. Blank line between paragraphs. “- ” for a list.' },
        { k: 'html', l: 'Paste HTML instead', t: 'textarea', rows: 10, code: 1, more: 1, hint: HTML_HINT },
        { k: 'link', l: 'Link to the original (optional)', t: 'url' }
      ]
    }
  };
  const DEFAULTS = {
    updates: () => ({ priority: 'info' }),
    news: () => ({ region: 'UK' }),
    team_members: () => ({ team: 'Housekeepers' }),
    newsletters: () => ({ month: new Date().toISOString().slice(0, 7) })
  };

  function openForm(kind, item) { st.editing = { kind, item }; renderForm(); }
  function closeForm() { st.editing = null; renderForm(); }

  function renderForm() {
    const hostEl = $('#formHost');
    hostEl.replaceChildren();
    hostEl.hidden = !st.editing;
    if (!st.editing) return;
    const { kind, item } = st.editing, cfg = FORMS[kind];
    const vals = item || DEFAULTS[kind]();
    const errEl = h('p', { class: 'ferr', role: 'alert', hidden: true });
    const main = h('div', { class: 'fields' });
    const moreBox = h('details', { class: 'more' }, h('summary', { text: 'Paste HTML instead' }));
    let hasMore = false;
    cfg.fields.forEach((f) => {
      const id = 'f-' + f.k;
      let input;
      if (f.t === 'textarea') { input = h('textarea', { id, name: f.k, rows: f.rows || 4, class: f.code ? 'code' : null, spellcheck: f.code ? 'false' : null }); input.value = vals[f.k] || ''; }
      else if (f.t === 'select') {
        input = h('select', { id, name: f.k }, f.o.map((o) => h('option', { value: o[0], text: o[1] })));
        input.value = vals[f.k] || f.o[0][0];
      } else { input = h('input', { type: f.t, id, name: f.k }); input.value = vals[f.k] || ''; }
      if (f.req) input.required = true;
      const field = h('div', { class: 'field' }, h('label', { for: id, text: f.l }), input, f.hint && h('p', { class: 'hint', text: f.hint }));
      if (f.more) { hasMore = true; if (vals[f.k]) moreBox.open = true; moreBox.append(field); } else main.append(field);
    });
    if (hasMore) main.append(moreBox);

    const save = h('button', { type: 'submit', class: 'btn', text: item ? 'Save' : 'Publish' });
    const bar = h('div', { class: 'fbar' }, save, h('button', { type: 'button', class: 'btn quiet', text: 'Cancel', onclick: closeForm }), h('span', { class: 'sp' }));
    if (item) {
      let armed = false;
      const del = h('button', { type: 'button', class: 'link-danger', text: 'Delete this ' + cfg.label });
      del.addEventListener('click', async () => {
        if (!armed) { armed = true; del.textContent = 'Click again to delete'; return; }
        del.disabled = true;
        const r = await sb.from(kind).delete().eq('id', item.id);
        if (r.error) { del.disabled = false; armed = false; del.textContent = 'Could not delete, try again'; return; }
        closeForm(); await loadAll(); note('Deleted.', 'ok', 4000);
      });
      bar.append(del);
    }
    const form = h('form', { class: 'form' }, h('h2', { text: (item ? 'Edit ' : 'New ') + cfg.label }), main, errEl, bar);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      const o = {};
      cfg.fields.forEach((f) => {
        const v = String(form.elements[f.k].value || '').trim();
        if (v) o[f.k] = v; else if (item) o[f.k] = null;
      });
      ['url', 'link'].forEach((k) => { if (o[k] && !safeUrl(o[k])) { errEl.textContent = 'Enter the full web address, starting with https://'; errEl.hidden = false; o.__bad = true; } });
      if (o.__bad) return;
      save.disabled = true;
      const q = item ? sb.from(kind).update(o).eq('id', item.id).select().single() : sb.from(kind).insert(o).select().single();
      const { data: rec, error } = await q;
      if (error || !rec) {
        save.disabled = false;
        errEl.textContent = error && error.code === '42501' ? 'You do not have permission to save here.' : 'Could not save. Check your connection and try again.';
        errEl.hidden = false;
        return;
      }
      closeForm();
      await loadAll();
      if (kind === 'newsletters' && !item) location.hash = 'issue-' + rec.id;
      note(item ? 'Saved.' : 'Published.', 'ok', 5000);
    });
    const overlay = h('div', { class: 'overlay' }, form);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeForm(); });
    hostEl.append(overlay);
    const first = form.querySelector('input, textarea, select');
    if (first) first.focus();
  }

  /* ---------- Data ---------- */

  async function loadAll() {
    const jobs = [sb.from('updates').select('*'), sb.from('newsletters').select('*'), sb.from('news').select('*'), sb.from('team_members').select('*')];
    if (isAdmin()) jobs.push(sb.from('suggestions').select('*'), sb.from('allowed_emails').select('*'), sb.from('access_requests').select('*'));
    let res;
    try { res = await Promise.all(jobs); } catch (e) { note('Could not load the hub. Check your connection and reload.', 'bad'); st.ready = true; refresh(); return; }
    if (res.some((r) => r.error)) note('Could not load everything. Reload the page or check your connection.', 'bad');
    data.updates = res[0].data || []; data.newsletters = res[1].data || []; data.news = res[2].data || []; data.team = res[3].data || [];
    if (isAdmin()) { data.suggestions = res[4].data || []; data.allowed = res[5].data || []; data.requests = res[6].data || []; }
    st.ready = true;
    refresh();
  }

  /* ---------- Shell ---------- */

  function renderChrome() {
    const v = st.route.view;
    const items = [['home', 'Home'], ['updates', 'Updates'], ['newsletters', 'Newsletters'], ['news', 'News'], ['team', 'Team'], ['suggestions', 'Suggestions']];
    if (isAdmin()) items.push(['people', 'People']);
    const nav = $('#nav');
    nav.replaceChildren(...items.map((n) => {
      const waiting = n[0] === 'people' ? data.requests.length : 0;
      return h('a', { href: '#' + n[0], 'aria-current': v === n[0] ? 'page' : null }, n[1], waiting > 0 && h('span', { class: 'dot', text: String(waiting) }));
    }), h('button', { type: 'button', text: 'Sign out', onclick: signOut }));
    $('#bandTitle').textContent = BAND[v][0];
    $('#bandSub').textContent = BAND[v][1];
    const add = $('#addBtn');
    add.hidden = !(ADD[v] && isAdmin());
    if (ADD[v]) { add.textContent = ADD[v]; add.onclick = () => openForm(v === 'team' ? 'team_members' : v, null); }
  }

  function refresh() { if (!st.role) return; renderChrome(); current.update(); }

  let lastView = null;
  function renderMain() {
    if (st.route.view === 'people' && !isAdmin()) st.route = { view: 'home' };
    renderChrome();
    const root = $('#main');
    const same = lastView === st.route.view;
    if (same && (st.route.view === 'newsletters' || st.route.view === 'updates')) { current.update(); window.scrollTo(0, 0); return; }
    root.replaceChildren();
    const mount = { home: mountHome, updates: mountUpdates, newsletters: mountNewsletters, news: mountNews, team: mountTeam, suggestions: mountSuggestions, people: mountPeople }[st.route.view];
    current.update = mount(root);
    lastView = st.route.view;
    current.update();
    if (!same) window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', () => { st.route = getRoute(); if (st.role) renderMain(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.editing) closeForm(); });
  window.addEventListener('focus', () => { if (st.role && st.ready && !st.editing) loadAll(); });
  setInterval(() => { if (isAdmin() && st.ready && !st.editing && !document.hidden) loadAll(); }, 60000);

  /* ---------- Sign-in ---------- */

  function gate(kind, ctx) {
    $('#app').hidden = true; $('#gate').hidden = false;
    closeForm();
    const box = $('#gateBody');
    box.replaceChildren();
    if (kind === 'loading') { box.append(h('p', { class: 'gf', text: 'Loading…' })); return; }
    if (kind === 'config') {
      box.append(h('div', { class: 'gf' }, h('h2', { text: 'Not connected yet' }), h('p', { text: 'Open config.js and fill in the Supabase address and key, then reload this page.' })));
      return;
    }
    if (kind === 'error') {
      box.append(h('div', { class: 'gf' }, h('h2', { text: 'Something went wrong' }), h('p', { text: ctx.msg }),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', text: 'Try again', onclick: () => location.reload() }))));
      return;
    }
    if (kind === 'pending') {
      const msg = h('p', { class: 'sg-msg', role: 'status', hidden: true });
      box.append(h('div', { class: 'gf' },
        h('h2', { text: 'Request sent' }),
        h('p', { text: 'Your email address is not on the list yet. Your request is now with the hub manager, who will see it the next time she opens the hub. Once approved, come back and sign in again.' }),
        msg,
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'btn', text: 'Check again', onclick: async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { gate('email'); return; }
            await enter(session, true);
            if (!st.role) { msg.textContent = 'Not approved yet.'; msg.hidden = false; }
          } }),
          h('button', { type: 'button', class: 'btn quiet', text: 'Sign out', onclick: signOut }))));
      return;
    }
    const mode = kind === 'signup' ? 'signup' : 'signin';
    const email = h('input', { id: 'g-email', type: 'email', required: true, autocomplete: 'email', inputmode: 'email', placeholder: 'you@example.com', value: (ctx && ctx.email) || '' });
    const pw = h('input', { id: 'g-pw', type: 'password', required: true, minlength: '8', autocomplete: mode === 'signup' ? 'new-password' : 'current-password' });
    const err = h('p', { class: 'ferr', role: 'alert', hidden: true });
    const btn = h('button', { type: 'submit', class: 'btn', text: mode === 'signup' ? 'Create my password' : 'Sign in' });
    const form = h('form', { class: 'gf' },
      h('h2', { text: mode === 'signup' ? 'First time here' : 'Sign in' }),
      h('p', { text: mode === 'signup' ? 'Choose a password (at least 8 characters). You can only enter if the hub manager has approved your email.' : 'Use your email and password.' }),
      h('label', { for: 'g-email', text: 'Email' }), email,
      h('label', { for: 'g-pw', text: 'Password' }), pw, err,
      h('div', { class: 'row' }, btn,
        h('button', { type: 'button', class: 'link', text: mode === 'signup' ? 'I already have a password' : 'First time here? Create a password', onclick: () => gate(mode === 'signup' ? 'email' : 'signup', { email: email.value }) })));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const em = email.value.trim().toLowerCase(), pass = pw.value;
      if (!em || !pass) return;
      btn.disabled = true; err.hidden = true;
      const fail = (t) => { btn.disabled = false; err.textContent = t; err.hidden = false; };
      if (mode === 'signup') {
        const { data: d, error } = await sb.auth.signUp({ email: em, password: pass });
        if (error) { fail(/registered|exists/i.test(error.message) ? 'This email already has a password. Use “I already have a password”.' : (/password/i.test(error.message) ? 'Choose a stronger password (at least 8 characters).' : 'Could not create the account. Try again.')); return; }
        if (!d.session) { fail('This email already has an account, or email confirmation is switched on. Try signing in.'); return; }
        enter(d.session);
      } else {
        const { data: d, error } = await sb.auth.signInWithPassword({ email: em, password: pass });
        if (error || !d || !d.session) { fail('Email or password is not right.'); return; }
        enter(d.session);
      }
    });
    box.append(form);
    email.value ? pw.focus() : email.focus();
  }

  async function enter(session, quiet) {
    st.email = String((session.user && session.user.email) || '').toLowerCase();
    const r = await sb.rpc('my_role');
    if (r.error) { gate('error', { msg: 'Could not check your access. Reload the page and try again.' }); return; }
    st.role = r.data || null;
    if (!st.role) {
      if (!quiet) {
        await sb.rpc('request_access');
      }
      gate('pending');
      return;
    }
    $('#gate').hidden = true; $('#app').hidden = false;
    st.ready = false; lastView = null;
    renderMain();
    await loadAll();
  }

  async function signOut() {
    await sb.auth.signOut();
    st.role = null; st.email = null; st.ready = false;
    data.updates = []; data.newsletters = []; data.news = []; data.team = []; data.suggestions = []; data.allowed = []; data.requests = [];
    gate('email');
  }

  (async function boot() {
    gate('loading');
    if (!sb) { gate('config'); return; }
    const { data: { session } } = await sb.auth.getSession();
    if (!session) gate('email'); else await enter(session);
  })();
})();
</script>
</body>
</html>
